<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Unsubscribe</title>
  <style>
    body{font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
         background:#f7f7f8;color:#374151; margin:0; padding:40px; display:flex; align-items:center; justify-content:center; min-height:100vh}
    .box{max-width:480px;width:100%;background:#fff;border-radius:24px;padding:48px;box-shadow:0 8px 30px rgba(20,20,30,0.08); text-align:center;}
    h1{color:#111827;margin-bottom:10px;font-size:24px}
    p{color:#4b5563;margin-bottom:24px}
    label{display:block;text-align:left;font-size:14px;color:#374151;margin-bottom:6px;font-weight:600}
    input[type="email"]{width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #d1d5db;border-radius:8px;font-size:15px;margin-bottom:20px}
    input[type="email"]:focus{outline:none;border-color:#3b82f6}
    button{width:100%;padding:12px 24px;background:#3b82f6;color:#fff;border:none;border-radius:8px;font-weight:600;font-size:15px;cursor:pointer}
    button:hover{background:#2563eb}
  </style>
</head>
<body>
  <div class="box">
    <h1>Unsubscribe</h1>
    <p>Confirm below and we will stop sending these emails right away.</p>
    <form name="unsubscribe" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" action="/unsubscribe-confirmed">
      <input type="hidden" name="form-name" value="unsubscribe" />
      <p style="display:none">
        <label>Don't fill this out if human: <input name="bot-field" /></label>
      </p>
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" required />
      <button type="submit">Unsubscribe me</button>
    </form>
  </div>

  <script>
    // Prefill from ?email= in the link (Zapier fills this in per recipient),
    // still editable in case the page is opened without the query param.
    var params = new URLSearchParams(window.location.search);
    var email = params.get("email");
    if (email) {
      document.getElementById("email").value = email;
    }
  </script>
</body>
</html>
